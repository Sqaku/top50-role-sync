name: Top 50 role sync

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 min (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, change no roles)"
        type: boolean
        default: true

concurrency:
  group: top50
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node sync.mjs
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROVER_KEY: ${{ secrets.ROVER_KEY }}
          # Scheduled runs only change roles once the repo variable LIVE is "1"; manual runs follow the checkbox.
          DRY_RUN: ${{ ((github.event_name == 'workflow_dispatch' && inputs.dry_run) || (github.event_name != 'workflow_dispatch' && vars.LIVE != '1')) && '1' || '0' }}
